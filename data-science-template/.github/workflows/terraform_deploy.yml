name: "Enterprise Terraform Deployment"

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/**'

env:
  TF_WORKING_DIR: 'terraform'
  # Enterprise Standard: Keyless authentication via OpenID Connect (OIDC).
  # These secrets are configured per-client in GitHub Repository Secrets.
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}

permissions:
  id-token: write      # Required for GCP Workload Identity Federation (OIDC)
  contents: read       # Required to check out the repository code
  pull-requests: write # Required for the CI/CD bot to post infrastructure plans in PR comments

jobs:
  terraform-plan:
    name: 'Terraform Plan & Validate'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v4

      - name: 'Authenticate to Google Cloud (OIDC)'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: 'Setup Terraform'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0" # Explicit version pinning to prevent breaking changes

      - name: 'Terraform Format Check'
        id: fmt
        run: terraform fmt -check -diff
        continue-on-error: false # Fails the pipeline if code is not properly formatted

      - name: 'Terraform Init'
        id: init
        run: terraform init
        
      - name: 'Terraform Validate'
        id: validate
        run: terraform validate -no-color

      - name: 'Terraform Plan'
        id: plan
        # Targets the production environment file from your template structure
        run: terraform plan -var-file="environments/prod.tfvars" -no-color -out=tfplan
        continue-on-error: true # Allows the workflow to continue to the next step to post the error on the PR

      - name: 'Post Plan to Pull Request'
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        env:
          PLAN: "terraform\n${{ steps.plan.outputs.stdout }}"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Auditability: Posts the exact infrastructure changes directly in the PR thread for client review
            const output = `#### Terraform Format and Style 🖌\`${{ steps.fmt.outcome }}\`
            #### Terraform Initialization ⚙️\`${{ steps.init.outcome }}\`
            #### Terraform Validation 🤖\`${{ steps.validate.outcome }}\`
            #### Terraform Plan 📖\`${{ steps.plan.outcome }}\`

            <details><summary>Click to view the exact infrastructure changes</summary>

            \`\`\`\n
            ${process.env.PLAN}
            \`\`\`

            </details>

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: 'Fail Plan Job on Error'
        if: steps.plan.outcome == 'failure'
        run: exit 1

  terraform-apply:
    name: 'Terraform Apply'
    runs-on: ubuntu-latest
    needs: terraform-plan
    # Guardrail: Apply ONLY executes when a Pull Request is approved and merged into main.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production # Enables GitHub's manual approval gate feature
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v4

      - name: 'Authenticate to Google Cloud (OIDC)'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: 'Setup Terraform'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: 'Terraform Init'
        run: terraform init

      - name: 'Terraform Apply'
        run: terraform apply -auto-approve -input=false -var-file="environments/prod.tfvars"